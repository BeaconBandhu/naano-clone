<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketplace — Naano</title>
<link rel="icon" href="https://naano.com/lp/naano-logo-nav.png"><link rel="stylesheet" href="app.css">
<style>
  body{background:linear-gradient(180deg,#dbeafe,#eef4ff 40%,var(--bg))}
  .mp-wrap{padding:28px clamp(16px,4vw,54px) 80px}
  .mp-top{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-weight:800;color:var(--ink)}
  .mp-body{display:grid;grid-template-columns:60px 1fr}
</style>
</head><body>
<div class="mp-wrap">
  <div class="mp-top reveal"><svg viewBox="0 0 32 32" width="26"><path d="M3 20 15 5l3 7-10 12z" fill="#101116"/><path d="M14 22 24 9l5 13z" fill="#101116"/><circle cx="12" cy="23" r="2.4" fill="#2d61f5"/></svg>naano</div>

  <div class="mp-frame reveal" style="--d:.06s">
    <div class="mp-urlbar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="url"><svg viewBox="0 0 24 24" width="12" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> naano.co/marketplace</span>
    </div>
    <div class="mp-body">
      <nav class="mp-rail">
        <a href="overview.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></a>
        <a href="#" class="is-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 9h18l-1.5 10.5a2 2 0 0 1-2 1.5H6.5a2 2 0 0 1-2-1.5zM3 9l2-5h14l2 5"/></svg></a>
        <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M8.6 3.6 5 5v6c0 5 3.5 7.5 7 8.4 3.5-.9 7-3.4 7-8.4V5l-3.6-1.4a6 6 0 0 0-4.8 0z"/></svg></a>
        <a href="collaborations.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/></svg></a>
        <a href="messages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 12a8 8 0 0 1-11.3 7.3L3 21l1.7-6.7A8 8 0 1 1 21 12z"/></svg></a>
        <a href="card.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><path d="M13 10h5M13 14h5"/></svg></a>
      </nav>
      <div class="mp-grid" id="grid"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
  // Real creators from the database (GET /api/creators) — replaces the old
  // hardcoded CR=[...] demo array. Fields that array made up and this API
  // doesn't track (a 0-100 "match score", median views, a starred flag) are
  // left out rather than faked; an empty result (fresh database, nobody has
  // signed up yet) renders an honest empty state instead of demo cards.
  var COLORS = ["#2d61f5","#ec1e63","#1f8f5f","#7a4dd6","#e8951f","#0a66c2"];
  var nice = function (n) {
    if (n == null) return "—";
    if (n >= 1000) return (n / 1000).toFixed(n % 1000 ? 1 : 0) + "K";
    return String(n);
  };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };

  fetch("/api/creators").then(function (r) { return r.json(); }).then(function (data) {
    var creators = data.creators || [];
    var grid = document.getElementById("grid");
    if (!creators.length) {
      grid.innerHTML = '<p class="u-muted" style="padding:24px">No creators have signed up yet — real signups appear here automatically.</p>';
      return;
    }
    grid.innerHTML = creators.map(function (c, i) {
      var initials = (c.name || "?").split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2);
      var category = (c.industries || []).join(" · ") || "—";
      return '<article class="mp-card reveal-scroll">' +
        '<div class="mp-card__top">' +
          '<span class="mp-card__num">' + (i + 1) + '</span>' +
          '<span class="mp-card__pick"></span>' +
          '<span class="mp-card__book"><span class="btn btn--ghost">Book</span></span>' +
        '</div>' +
        '<div class="mp-card__body">' +
          '<span class="mp-av ai" style="background:' + COLORS[i % COLORS.length] + ';color:#fff;font-weight:800">' + esc(initials) + '</span>' +
          '<div class="mp-card__name">' + esc(c.name) + '</div>' +
          '<div class="mp-card__cat">' + esc(category) + '</div>' +
          (c.country ? '<span class="flag-chip">' + esc(c.country) + '</span>' : '') +
          '<p class="mp-card__bio">' + (esc(c.headline) || '&nbsp;') + '</p>' +
          '<div class="mp-card__stats"><div><b>' + nice(c.followers) + '</b><span>Followers</span></div><div><b>€' + (c.pricePerPostCents / 100).toLocaleString() + '</b><span>Post cost</span></div></div>' +
        '</div></article>';
    }).join("");
  }).catch(function (e) {
    document.getElementById("grid").innerHTML = '<p class="u-muted" style="padding:24px">Could not load creators: ' + esc(e.message) + '</p>';
  });
</script>
</body></html>
