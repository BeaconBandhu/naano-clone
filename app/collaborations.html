<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collaborations — Naano</title>
<link rel="icon" href="https://naano.com/lp/naano-logo-nav.png"><link rel="stylesheet" href="app.css">
</head><body>
<main class="page" data-page="collaborations.html">
  <div class="page__head reveal">
    <h1>Collaborations</h1>
    <p>Every step tells you where you stand, what to do, and what happens if you do nothing.</p>
  </div>

  <div class="tabs reveal" style="--d:.06s" data-tabs>
    <button class="tab is-on" data-tab="all">All <span class="badge-count">0</span></button>
    <button class="tab" data-tab="active">Active <span class="badge-count">0</span></button>
    <button class="tab" data-tab="need">Needs action <span class="badge-count">0</span></button>
    <button class="tab" data-tab="sent">Applications sent <span class="badge-count">0</span></button>
    <button class="tab" data-tab="declined">Declined <span class="badge-count">0</span></button>
    <button class="tab" data-tab="done">Completed <span class="badge-count">0</span></button>
  </div>

  <div class="card reveal" style="--d:.1s;margin-top:16px;padding:0">
    <table class="table">
      <thead><tr><th>Brand</th><th>Campaign</th><th>Status</th><th>Performance</th><th>Next action</th><th>Due date</th><th>Your net</th></tr></thead>
      <tbody><tr><td class="table__empty" colspan="7">No collaborations yet. Brand invitations and your accepted applications land here.</td></tr></tbody>
    </table>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)">
      <span>0 collaborations</span>
      <span class="badge-count" style="background:var(--blue-050);color:var(--blue)">1</span>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body></html>
